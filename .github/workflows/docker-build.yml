name: Build & Push Docker Images

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  packages: write        # ← permission d'écrire sur GHCR

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./alia-portfolio-backend
          push: true
          tags: |
            ghcr.io/diagnealia03-cmd/portfolio-backend:latest
            ghcr.io/diagnealia03-cmd/portfolio-backend:${{ github.sha }}

      - name: Build & Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./alia-portfolio-frontend
          push: true
          tags: |
            ghcr.io/diagnealia03-cmd/portfolio-frontend:latest
            ghcr.io/diagnealia03-cmd/portfolio-frontend:${{ github.sha }}
